name: Build DustinBot V11 VisualTarget APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Extract VisualTarget project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "DustinBotV11_VisualTarget.zip" -d project

          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found in ZIP"
            unzip -l "DustinBotV11_VisualTarget.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "$PROJECT_DIR" > project_dir.txt

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          curl -fsSL \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          find project \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find project \
            -type f \
            -name "*.apk" \
            | head -n 1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV11-VisualTarget-APK
          path: project/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
